    <style>
        :root { --gold: #c8a951; --gold-hover: #b8942e; --dark: #111111; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rubik', sans-serif;
            background: var(--dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .nb-404-logo img { height: 64px; width: auto; margin-bottom: 40px; }
        .nb-404-code {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 700;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 16px;
        }
        .nb-404-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(20px, 4vw, 32px);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }
        .nb-404-desc {
            font-size: 16px;
            color: rgba(255,255,255,0.65);
            max-width: 480px;
            line-height: 1.7;
            margin-bottom: 40px;
        }
        .nb-404-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
        .nb-btn-primary {
            display: inline-flex; align-items: center; gap: 10px;
            font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            background: var(--gold); color: #111;
            padding: 14px 30px; border-radius: 2px;
            transition: all 0.3s; text-decoration: none;
        }
        .nb-btn-primary:hover { background: var(--gold-hover); color: #111; transform: translateY(-2px); }
        .nb-btn-outline {
            display: inline-flex; align-items: center; gap: 10px;
            font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600;
            letter-spacing: 2px; text-transform: uppercase;
            background: transparent; color: #fff;
            padding: 13px 30px; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 2px; transition: all 0.3s; text-decoration: none;
        }
        .nb-btn-outline:hover { border-color: var(--gold); color: var(--gold); }
        .nb-404-footer {
            position: absolute; bottom: 24px;
            font-size: 12px; color: rgba(255,255,255,0.35);
            letter-spacing: 1px;
        }
    </style>
</head>

    <main id="main-content">

        </div>
        <p class="nb-404-footer">© 2026 Norden Barber — Cuenca, Castilla-La Mancha</p>
